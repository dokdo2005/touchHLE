name: FlyMe2theMoon compatibility checks

on:
  push:
    branches:
      - flyme2themoon
  pull_request:
    branches:
      - flyme2themoon

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout touchHLE fork and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          # The hosted runner may contain a Microsoft apt source that returns
          # HTTP 403. It is unrelated to our Ubuntu build dependencies.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ |
            while IFS= read -r source; do sudo mv "$source" "$source.disabled"; done
          sudo apt-get update
          sudo apt-get install -y             build-essential clang cmake pkg-config libboost-dev             libasound2-dev libudev-dev libgl1-mesa-dev libopenal-dev libsdl2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Linux compilation
        run: cargo check --lib

      - name: Test Objective-C protocol parser
        run: cargo test --lib protocol_tests::detects_direct_inherited_and_unrelated_protocols

      - name: Test FlyMe2theMoon WAV path fallback
        run: cargo test --lib flyme2themoon_audio_path_tests
